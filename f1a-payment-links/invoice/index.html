<!doctype html>
<html data-theme="light" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice — get paid in USDC on Base</title>
<meta property="og:title" content="Invoice — get paid in USDC on Base">
<meta property="og:description" content="A hosted, payable invoice. No account, no wallet install for the payer.">
<style>
  :root { --fg:#0f172a; --muted:#64748b; --bg:#f8fafc; --card:#fff; --line:#e2e8f0; --btn:#1f6feb;
          --ok:#0f9d58; --warn:#b45309; --bad:#b91c1c; --chip:#f1f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--fg); background:var(--bg); }
  .wrap { max-width:680px; margin:4vh auto; padding:0 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  header { display:flex; align-items:center; gap:10px; margin-bottom:2px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  .dot.ok { background:var(--ok); box-shadow:0 0 0 4px rgba(15,157,88,.12); }
  .dot.bad { background:var(--bad); box-shadow:0 0 0 4px rgba(185,28,28,.12); }
  h1 { font-size:20px; margin:0; font-weight:700; flex:1; letter-spacing:-.01em; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--muted); font-weight:650; }
  .badge.paid { background:#dcfce7; color:#166534; }
  .badge.due  { background:#fef3c7; color:#92400e; }
  .sub { color:var(--muted); font-size:13.5px; margin:6px 0 16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 5px; font-weight:650; text-transform:uppercase; letter-spacing:.03em; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:9px; font:14px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--fg); background:#fff; }
  input:focus, textarea:focus { outline:2px solid rgba(31,111,235,.25); border-color:rgba(31,111,235,.4); }
  button { padding:12px 16px; border:0; border-radius:9px; background:var(--btn); color:#fff; font-size:15px; font-weight:650; cursor:pointer; }
  button.wide { width:100%; margin-top:16px; }
  button:disabled { opacity:.55; cursor:default; }
  .foot { color:var(--muted); font-size:12px; margin-top:14px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
  .err { color:var(--bad); font-size:13.5px; margin-top:10px; }
  .hide { display:none; }
  .fee { background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:13px; margin-top:14px; }
  table.items { width:100%; border-collapse:collapse; margin:14px 0; }
  table.items th, table.items td { text-align:right; padding:8px 6px; border-bottom:1px solid var(--line); font-size:14px; }
  table.items th:first-child, table.items td:first-child { text-align:left; }
  table.items th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  table.items tr:last-child td { border-bottom:0; }
  .tot { display:flex; justify-content:space-between; padding:10px 6px 2px; font-weight:700; font-size:16px; border-top:2px solid var(--fg); }
  .meta { color:var(--muted); font-size:13px; margin:2px 0; }
  .pay { margin-top:18px; border-top:1px solid var(--line); padding-top:16px; text-align:center; }
  .qrbox { display:inline-block; padding:10px; background:#fff; border:1px solid var(--line); border-radius:10px; }
  .depaddr { display:block; font-size:12px; color:var(--fg); background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:6px; word-break:break-all; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; justify-content:center; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; background:#fff; cursor:pointer; }
  .copyok { color:var(--ok); font-size:12px; }
  .paidbox { margin-top:16px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:9px; padding:12px 14px; font-size:13.5px; }
  .warnbox { margin-top:12px; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:10px 12px; font-size:13px; }
  .footbar { margin-top:22px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; text-align:center; }
  .footbar a { color:var(--muted); }
  .rows { margin-top:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--muted); }
  .row .v { font-weight:600; text-align:right; }
  .toggle { display:flex; gap:8px; margin-top:8px; }
  .toggle .chip.on { color:var(--btn); border-color:rgba(31,111,235,.4); background:rgba(31,111,235,.06); }
</style>

    });
  };
})(window);

<script>
// ══════════════════════════════════════════════════════════════════════════════════════════
// INVOICE — a JSON object in the URL FRAGMENT is the whole invoice. No server, no DB, no account.
//   #i=<base64url(json)>   the document
// The page RENDERS that object; "API" = POST/emit the same JSON. Everything shown that is a
// number/address comes from the object or the chain — nothing is fabricated (#112/#15).
//
// ONE PRIMITIVE (v1, link leg): f1a `request(to, USDC, amount, keccak(memo))` -> a deposit address
// that auto-forwards to `to`; the forwarder pays p2's live fee. The payer does ONE ERC-20 transfer.
// QR is EIP-681 (token@chain/transfer?…) — never raw hex. (Escrow leg = v3, per the design doc.)
//
// SOURCES copied, never retyped (GOTCHA #73): RequestRegistry 0x9651cD59…c749, fee contract
// 0xe9515881…311a8, USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 (6dp) — all from
// f1a-payment-links/DEPLOY-PREP.md. The QR block above is payme/index.html's, byte-identical (#131).
// ══════════════════════════════════════════════════════════════════════════════════════════
"use strict";
// ── hard per-attempt fetch timeout (GOTCHAS #138/#147) ─────────────────────────────────────────
// Without this a HUNG transport never rejects, so the retry/rotate path never engages and the boot
// sits on its spinner forever. An abort REJECTS exactly like a network fault, so the EXISTING
// retry path finally runs. Cleared in finally; never masks a real answer.


const CFG = {
  chainId: 8453,
  rpc: "https://base-rpc.publicnode.com",
  requestRegistry: "0xeD395024Bba719564bec617b6b42CF6fDC8a252c",
  feeContract:     "0x417c41d406c61E09958032Cd77338fc1F1ac7D45",
  usdc: { sym:"USDC", dec:6, addr:"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" },
  // NO bakedFeeBps (S4-4 ← S3-3), same as payme/join: feeBps() on the fee contract is the primary
  // truth; if it faults the TollRegistry's toll() for this rail is a genuine SECOND SOURCE (a chain
  // read, not a constant); if BOTH fault the page says "unreachable" and carries a retry. The key is
  // keccak-derived from the rail name below, never typed as a hash. Address: g4c DEPLOY-EVIDENCE.md.
  tollRegistry: "0xc8319D6fbc0A8f1685Df9c567557141A289b7A1b",
  productKey: "p2-forwarder",   // the rail this invoice settles through: the p2 forwarder + its Registry
  pageBase: "https://dngr2.github.io/dex-products/f1a-payment-links/invoice/",
  homeLink: "https://dngr2.github.io/dex-products/",
};
const SEL = {
  feeBps: "0x24a9d853",        // feeBps() -> uint16 (on the fee contract == p2 Registry)
  request: "0xdc0edd60",       // request(address,address,uint256,bytes32) -> (uint256,address)
  predict: "0xd6d52f00",       // predictDepositFor(address) -> address
  p2Registry: "0x7d0f1201",    // p2Registry() -> address
  toll: "0x71a41241",          // toll(bytes32) -> (address,uint16,bool) on the TollRegistry (S4-4 2nd source)
};

const strip0x = (h) => (h||"").replace(/^0x/i,"").toLowerCase();
const wordAddr = (a) => strip0x(a).padStart(64,"0");
const wordUint = (v) => BigInt(v).toString(16).padStart(64,"0");
const shortAddr = (a) => a ? a.slice(0,6)+"…"+a.slice(-4) : "";
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (id) => document.getElementById(id);
const setText = (id,t) => { const e=$(id); if(e) e.textContent=t; };
const show = (id,on) => { const e=$(id); if(e) e.classList[on?"remove":"add"]("hide"); };

// ── EIP-681: token @ chain / transfer ? address=&uint256=  (checked; EIP-681 grammar) ─────────
function eip681Usdc(toAddr, amountUnits){
  return `ethereum:${CFG.usdc.addr}@${CFG.chainId}/transfer?address=${toAddr}&uint256=${amountUnits}`;
}

// ── the invoice object <-> fragment (base64url of compact JSON; the document IS the URL) ─────
function encodeInvoice(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let b64 = btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return b64;
}
function decodeInvoice(b64){
  try {
    let s = b64.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "=";
    const bin = atob(s), bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch(e){ return null; }
}

// ── human <-> base units (bigint, never float) ───────────────────────────────────────────────
function parseHuman(str, dec){
  str = String(str==null?"":str).trim().replace(/^\$/,"");
  if (!str) return 0n;
  if (!/^\d*\.?\d*$/.test(str)) throw new Error("not a number");
  const [w,f=""] = str.split(".");
  return BigInt(w||"0")*(10n**BigInt(dec)) + BigInt((f+"0".repeat(dec)).slice(0,dec)||"0");
}
function fmtUnits(u, dec){
  u = BigInt(u); const s = u.toString().padStart(dec+1,"0");
  const whole = s.slice(0,s.length-dec), frac = s.slice(s.length-dec).replace(/0+$/,"");
  return whole + (frac ? "."+frac : "");
}
const itemU = (it, dec) => parseHuman(it.u, dec) * BigInt(it.q||1);      // line total in base units
function totalU(inv, dec){ let t=0n; for (const it of inv.items||[]) t += itemU(it, dec); return t; }
// the amount the payer SENDS: pass => client covers the toll on top; gross => payee absorbs it.
function payU(inv, dec, bps){ const t = totalU(inv,dec); const fee=(t*BigInt(bps))/10000n; return inv.fee==="pass" ? t+fee : t; }

// ── RPC (tri-state: a JSON-RPC error and a transport fault are DIFFERENT evidence) ───────────
async function rpc(method, params){
  let res;
  try { res = await _fetchT(CFG.rpc, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({jsonrpc:"2.0",id:1,method,params})}); }
  catch(e){ throw new Error("transport: "+(e&&e.message?e.message:e)); }
  if (!res.ok) throw new Error("http "+res.status);
  const j = await res.json();
  if (j.error) throw new Error("rpc: "+(j.error.message||JSON.stringify(j.error)));
  if (j.result == null) throw new Error("rpc: null result");
  return j.result;
}
const ethCall = (to,data) => rpc("eth_call",[{to,data},"latest"]);
const asAddr = (hex) => "0x"+strip0x(hex).slice(24);
const asUint = (hex) => BigInt(hex);

const LIVE = { ok:false, why:"", feeBps:null, deposit:null, chainId:null };
async function liveCheck(){
  try {
    const cid = Number(BigInt(await rpc("eth_chainId",[])));
    if (cid !== CFG.chainId) throw new Error("wrong chain "+cid);
    const p2 = asAddr(await ethCall(CFG.requestRegistry, SEL.p2Registry));
    if (p2.toLowerCase() !== CFG.feeContract.toLowerCase()) throw new Error("p2Registry()!="+CFG.feeContract);
    const bps = Number(asUint(await ethCall(CFG.feeContract, SEL.feeBps)) % (1n<<16n));
    Object.assign(LIVE,{ok:true,why:"",feeBps:bps,chainId:cid});
  } catch(e){
    // the fee-contract read faulted. Try the SECOND SOURCE before giving up: a live registry read beats
    // a BAKED constant. Both faulted -> feeBps stays null and the page says unreachable.
    const t = await readTollBps();
    Object.assign(LIVE,{ok:false,why:String(e&&e.message?e.message:e),feeBps:t});
  }
  return LIVE.ok;
}
// ── keccak256 (Ethereum), pure JS — COPY-SHAPED from payme/join, used ONLY to derive the registry
//    product KEY from its rail name so the key is never a typed hash (GOTCHA #73/#95) ────────────
const MASK = (1n << 64n) - 1n;
const RC = [0x1n,0x8082n,0x800000000000808an,0x8000000080008000n,0x808bn,0x80000001n,0x8000000080008081n,0x8000000000008009n,0x8an,0x88n,0x80008009n,0x8000000an,0x8000808bn,0x800000000000008bn,0x8000000000008089n,0x8000000000008003n,0x8000000000008002n,0x8000000000000080n,0x800an,0x800000008000000an,0x8000000080008081n,0x8000000000008080n,0x80000001n,0x8000000080008008n];
const ROT = [[0,36,3,41,18],[1,44,10,45,2],[62,6,43,15,61],[28,55,25,21,56],[27,20,39,8,14]];
function rol(x, n){ n %= 64n; return ((x << n) | (x >> (64n - n))) & MASK; }
function keccakF(A){ for (let r=0;r<24;r++){ const Cc=[0n,0n,0n,0n,0n],D=[0n,0n,0n,0n,0n];
  for (let x=0;x<5;x++) Cc[x]=A[x][0]^A[x][1]^A[x][2]^A[x][3]^A[x][4];
  for (let x=0;x<5;x++) D[x]=Cc[(x+4)%5]^rol(Cc[(x+1)%5],1n);
  for (let x=0;x<5;x++) for (let y=0;y<5;y++) A[x][y]^=D[x];
  const B=[[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n]];
  for (let x=0;x<5;x++) for (let y=0;y<5;y++) B[y][(2*x+3*y)%5]=rol(A[x][y],BigInt(ROT[x][y]));
  for (let x=0;x<5;x++) for (let y=0;y<5;y++) A[x][y]=B[x][y]^((~B[(x+1)%5][y])&B[(x+2)%5][y]&MASK);
  A[0][0]^=RC[r]; } }
function hexToBytes(h){ h=h.replace(/^0x/,""); const o=new Uint8Array(h.length/2); for (let i=0;i<o.length;i++) o[i]=parseInt(h.substr(i*2,2),16); return o; }
function bytesToHex(b){ return "0x"+[...b].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function keccak256(input){ const msg=typeof input==="string"?hexToBytes(input):input; const rate=136,P=0x01,S=0x80;
  const padLen=rate-(msg.length%rate); const pad=new Uint8Array(padLen); pad[0]=P; pad[pad.length-1]|=S;
  const buf=new Uint8Array(msg.length+pad.length); buf.set(msg); buf.set(pad,msg.length);
  const A=[[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n],[0n,0n,0n,0n,0n]];
  for (let off=0;off<buf.length;off+=rate){ for (let i=0;i<rate/8;i++){ let lane=0n; for (let b=7;b>=0;b--) lane=(lane<<8n)|BigInt(buf[off+i*8+b]); A[i%5][(i/5)|0]^=lane; } keccakF(A); }
  const out=new Uint8Array(32); for (let i=0;i<4;i++){ let lane=A[i%5][(i/5)|0]; for (let b=0;b<8;b++){ out[i*8+b]=Number(lane&0xffn); lane>>=8n; } } return bytesToHex(out); }
const utf8Hex = (s) => bytesToHex(new TextEncoder().encode(s));
const tollKey = () => keccak256(utf8Hex(CFG.productKey));   // keccak-derived, never typed

// S4-4 SECOND SOURCE: the deployed registry's toll for this rail. feeBps() is the primary truth; a
// toll() read is still the CHAIN, not a constant. null on a fault (unregistered key / dead RPC).
async function readTollBps(){
  try {
    const raw = await ethCall(CFG.tollRegistry, SEL.toll + tollKey().replace(/^0x/, ""));
    return Number(BigInt("0x" + strip0x(raw).slice(64,128)) % (1n<<16n));   // (recipient, feeBps, live) -> word #2
  } catch(e){ return null; }
}
// the fee the UI shows: the fee-contract read, else the registry's live toll, else null (unreachable).
// The SOURCE is always named so the page never dresses one read as the other.
function feeDisplay(){
  if (LIVE.ok && LIVE.feeBps != null) return { bps: LIVE.feeBps, src: "fee-contract" };
  if (LIVE.feeBps != null)            return { bps: LIVE.feeBps, src: "registry" };
  return { bps: null, src: null };
}
const feeBpsNow = () => { const f = feeDisplay(); return f.bps; };
async function predictDeposit(to){ return asAddr(await ethCall(CFG.requestRegistry, SEL.predict+wordAddr(to))); }
function setDot(kind,text){ const d=$("dot"); if(d) d.className="dot"+(kind?" "+kind:""); if(text!=null) setText("status",text); }
// the boot health line: names which source answered, and the both-faulted state honestly.
function paintHealth(){
  const f = feeDisplay();
  if (LIVE.ok) setDot("ok", "Live · registry reachable · fee "+LIVE.feeBps+" bps");
  else if (f.src === "registry") setDot("bad", "fee contract read faulted — fee from the toll registry's live toll, not a baked number");
  else setDot("bad", "UNREACHABLE — fee contract and registry both faulted; press retry");
}

// ── render: BUILDER (no #i=) ─────────────────────────────────────────────────────────────────
function renderBuilder(){

// the fee chip always names its source; null means BOTH reads faulted and nothing is invented.
function paintFee(){
  const f = feeDisplay();
  setText("feebps", f.src === "fee-contract" ? (f.bps + " bps — live")
                 : f.src === "registry"     ? (f.bps + " bps — live (via toll registry; fee-contract read faulted)")
                 : "unreachable — retry");
}
async function retryFee(){ setText("feebps","reading…"); await liveCheck(); paintFee(); paintHealth(); }
function parseItems(text){
  const out = [];
  for (const line of String(text||"").split("\n")){
    if (!line.trim()) continue;
    const parts = line.split("|").map(s=>s.trim());
    if (parts.length < 3) continue;
    const u = parts[2].replace(/^\$/,"");
    if (!/^\d*\.?\d*$/.test(u) || u==="") continue;
    out.push({ d: parts[0]||"item", q: Math.max(1, parseInt(parts[1]||"1",10)||1), u });
  }
  return out;
}
async function onBuild(feeMode){
  setText("err",""); show("err",false); show("result",false);

}

// ── render: HOSTED (has #i=) — the payer's view ─────────────────────────────────────────────
let currentInv = null;
async function renderHosted(inv){

        : `<p class="meta" style="text-align:right">− ${bpsTxt} bps fee (${esc(fmtUnits(feeU,dec))} USDC) absorbed</p>`}

     </div>

  $("footbar").innerHTML = `paid via <a href="${CFG.homeLink}" target="_blank" rel="noopener">DEX fleet</a> · non-custodial · fee ${esc(String(bpsTxt))} bps, read live`;

// ── receipt-on-payment: READ THE CHAIN, never a server ───────────────────────────────────────
async function watchPaid(dep){
  const poll = async () => {
    try {
      const bal = asUint(await ethCall(CFG.usdc.addr, "0x70a08231"+wordAddr(dep)));   // balanceOf(dep)
      if (bal > 0n){
        const b = $("paybadge"); if (b){ b.textContent = "paid"; b.className = "badge paid"; }
        const r = $("receipt");
        if (r){ r.className = "paidbox"; r.innerHTML =
          `<b>Paid ✓</b> — ${esc(fmtUnits(bal, CFG.usdc.dec))} USDC received at the deposit address. ` +
          `The forwarder sweeps it to <span class="mono">${esc(shortAddr(currentInv.to))}</span> within ~1 block. ` +
          `<span class="mono">dep ${esc(shortAddr(dep))} · fee ${esc(String(feeBpsNow()))} bps</span>`; }
        setDot("ok","PAID — "+fmtUnits(bal,CFG.usdc.dec)+" USDC seen on chain.");
        clearInterval(h); return;
      }
    } catch(e){ /* keep last state; a transient RPC blip is not a state change */ }
    setTimeout(poll, 6000);
  };
  const h = setInterval(()=>{}, 1<<30);   // placeholder so clearInterval works; poll self-schedules
  poll();
}

function setErr(t){ if(t){ show("err",true); setText("err",t);} else show("err",false); }
function copy(text, id){
  const done = () => { const e=$(id); if(e){ const o=e.textContent; e.textContent=o+" ✓"; setTimeout(()=>{e.textContent=e.textContent.replace(" ✓","");},1200);} };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>selCopy(text,done)());
  else selCopy(text,done)();
}
function selCopy(t,done){ return () => { try{ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }catch(e){} done(); }; }

// ── boot ─────────────────────────────────────────────────────────────────────────────────────
async function main(){
  const frag = (location.hash||"").replace(/^#/,"");
  const q = new URLSearchParams(frag);
  const raw = q.get("i");
  if (!raw){
    await liveCheck(); renderBuilder();
    paintHealth();
    document.title = "New invoice — get paid in USDC on Base";
    return;
  }
  const inv = decodeInvoice(raw);
  if (!inv || !inv.to){ $("root").innerHTML = `<header><span class="dot bad"></span><h1>Bad invoice link</h1></header><p class="sub">The #i= fragment did not decode to an invoice.</p>`; return; }
  currentInv = inv;
  document.title = "Invoice"+(inv.memo?" "+inv.memo:"")+" — "+fmtUnits(totalU(inv,CFG.usdc.dec),CFG.usdc.dec)+" USDC";
  await liveCheck();
  await renderHosted(inv);
}

if (typeof window !== "undefined"){
  window.__invoice = { CFG, SEL, encodeInvoice, decodeInvoice, eip681Usdc, parseHuman, fmtUnits, totalU, payU, parseItems, LIVE };
}
if (typeof document !== "undefined" && document.getElementById) main();
</script>
