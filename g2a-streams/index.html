<!--
  G2-a — payment streams. ONE static file, NO server, NO build step, NO third-party deps.
  Hand-rolled ABI encode/decode over raw eth_call, matching the lane's style (see p3-router/frontend,
  g2b-escrow/frontend, f1c-duster/frontend, p2-forwarder/frontend — the same convention).

  WHAT IT DOES: a stream is a tiny vault that drips a token to a recipient over a fixed window. The
  vault is CREATE2-minted by the factory, so no per-stream key is ever needed and the address is
  PREDICTABLE before the tx. The recipient pulls whatever has vested, PERMISSIONLESSLY — the caller
  pays the gas, the recipient gets the money.

  THE WHOLE POINT OF THIS PAGE: prove the Base factory is the REAL factory, not a same-string
  impostor, and prove the withdraw path is really permissionless.
    1. The factory is proved by RUNTIME IDENTITY — keccak(runtime code) must equal the recorded
       artefact hash 0xa4798afc… (GOTCHA #95). The page fetches the code and hashes it itself.
    2. The same-string Sepolia factory 0x83303e59… on Base is shown FAILING the same proof: 594 B
       (not 16,643), and streamCount() REVERTS instead of answering (the live #95 pair from the
       record). An impostor must render 'wrong', never 'ok'.
    3. The permissionless-withdraw claim is asserted from the vault CODE: the recipient is an
       immutable read off the vault, and `withdraw()` takes NO arguments — so the payee cannot
       depend on the caller. The page says this in words AND wires a real button.

  HONESTY RULES THIS PAGE FOLLOWS:
   1. The FEE is read LIVE off the factory's own feeBps() — never typed. The rate has been re-rated
      25 -> 100 -> 500 bps (owner-settable); the page shows whatever the chain says today, and mirrors
      the contract's own arithmetic floor(w * feeBps / 10_000) so a reader can reproduce a payout by hand.
   2. An unreadable chain is its OWN state. A dead RPC renders "unreachable", NEVER a silent 0 or a
      false "ok" (GOTCHAS #27/#112/#147) — the probe failed the row, it did not zero it.
   3. Cancel is CANCEL-AWARE: post-cancel withdrawable() is 0 even though streamedAt() keeps
      rising. The page reads `canceled` and renders that plainly rather than showing a phantom.
   4. Read-only: the whole page works with NO wallet. Broadcast buttons use `window.ethereum` if
      present, and say so honestly if it is not.

  ROUTE: hash-routed so file:// works.  #/  -> factory proof + live stream   #/vault=<addr> -> a vault
  CONFIG via query: ?rpc=<url> overrides the RPC.
-->

<script>
"use strict";
// ── hard per-attempt fetch timeout (GOTCHAS #138/#147) ─────────────────────────────────────────
// Without this a HUNG transport never rejects, so the retry/rotate path never engages and the boot
// sits on its spinner forever. An abort REJECTS exactly like a network fault, so the EXISTING
// retry path finally runs. Cleared in finally; never masks a real answer.

// =============================== config =========================================================
const PARAMS = new URLSearchParams(location.search);
const RPC = PARAMS.get("rpc") || "https://base-rpc.publicnode.com";
// alternate endpoints for the boot gate below (same ENDPOINT-POLICY order as _FALLBACK)
const RPC_ALTS = ["https://base.drpc.org", "https://mainnet.base.org"];
const CHAIN_ID = 8453;
const EXPLORER = "https://basescan.org";

// Facts COPIED from products/g2a-streams/KEY-RECORD.md — never retyped (GOTCHA #73). verify.mjs
// diffs each literal below against that file.
const FACTORY = "0x3882A049ee99B96Ea68DF317713ed76008b9A075";       // v2.1 StreamFactory (Base), V21-DEAD-DROP-FIX-EVIDENCE
const ARTEFACT_KECCAK = "0xa4798afcb277754b4bc6232981f29bb569a84d0801f455ff0a8ab79e2b3a6761";
const ARTEFACT_BYTES = 16643;                                       // KEY-RECORD: verified v2.1 code 16,643 bytes
// The smoke vault below was minted by the ORIGINAL throwaway factory (v1), whose immutable factory() is
// v1 forever — a repoint cannot move a CREATE2-minted vault's producer. So a vault of "this lineage" may
// name a known-historic PRODUCER (v1/v2), never only the current address. Both listed producers are
// PAUSED and neither is the live one; v1 is FIRST because it is the only one that actually minted a
// vault (streamCount(payer)=1; v2 and the relaunch factory both read 0), so `vintageOf`'s index-0 label
// — the v1 one — is the one the live vault gets. Runtime byte lengths prove they are NOT copies of the
// current factory (v1 9,385 B · v2 15,479 B vs FACTORY's 16,643 B, all keccaks differ).
const FACTORY_HISTORIC = [
  "0x2bB5b763a8A85e446909674177e65cb6F1052b4F",   // v1 — the smoke vault's producer (frozen, PAUSED)
  "0x14bBd99B840a0Bf087b21A31e27BA83B45f958a0",   // v2 — superseded, PAUSED (minted nothing live)
];
const TREASURY = "0x5c0fc0917260A0656D253f1625053e3E6Dd2Ef3c";     // KEY-RECORD: OWNER=FEE_RECIPIENT
const PAYER = "0x85C6764D55D647663E19465FdE80DF58638BbeD6";        // KEY-RECORD: deployer / this key
const VAULT_LIVE = "0xB599140D0F49eF4d363CD3C409e57bDE9FE3ed7F";   // the smoke stream, read live below
// The permissionless pull's PROOF, copied from KEY-RECORD (LIVE SMOKE — Base mainnet section).
const WITHDRAW_TX = "0xe971b89b5a652180036c07e06d6da6ccdf3248dcdaeb3fb282040e2217194c64"; // Withdrawn, status 1
const CALLER_THIRD_KEY = "0xDB6A5eAfFA293CB27Ee7e67869e71048e09e6d92";  // sent the tx, ≠ recipient
// THE TRAP (GOTCHA #95): the Sepolia factory string, which on Base is a 594-byte DIFFERENT contract.
const IMPOSTOR = "0x83303e59d4F9798C3B49f9D4C6E522FfeC05f2A5";
const IMPOSTOR_BYTES = 594;

// =============================== codec ==========================================================
const word = (h) => String(h).padStart(64, "0");
const pad32 = (v) => word(BigInt(v).toString(16));
const addr32 = (a) => word(a.toLowerCase().replace(/^0x/, ""));
const isAddr = (a) => /^0x[0-9a-fA-F]{40}$/.test(a || "");
const isBytes32 = (a) => /^0x[0-9a-fA-F]{64}$/.test(a || "");
const short = (a) => (a ? a.slice(0, 10) + "…" + a.slice(-8) : "");
const hexToBig = (h) => BigInt(h && h !== "0x" ? h : "0x0");
const addrOf = (h) => "0x" + String(h).slice(-40);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmt18 = (n) => { const s = (Number(n) / 1e18).toFixed(9).replace(/0+$/, "").replace(/\.$/, ""); return s === "" ? "0" : s; };

// ---- keccak256 (Ethereum) in pure JS — same implementation p3 proved against `cast keccak` -------

const utf8Hex = (s) => bytesToHex(new TextEncoder().encode(s));
const sig = (s) => keccak256(utf8Hex(s)).slice(0, 10);   // DERIVED, never typed

// EVERY selector below is DERIVED. verify.mjs asserts each == `cast sig <the same signature>`, so a
// signature typo cannot hide behind a plausible-looking literal.
const SEL = {
  feeBps:        sig("feeBps()"),
  feeRecipient:  sig("feeRecipient()"),
  owner:         sig("owner()"),
  paused:        sig("paused()"),
  MIN_DURATION:  sig("MIN_DURATION()"),
  MAX_FEE_BPS:   sig("MAX_FEE_BPS()"),
  streamCount:   sig("streamCount(address)"),
  streamsOf:     sig("streamsOf(address,uint256)"),
  predict:       sig("predict(address,address,address,uint256,uint64,uint64)"),
  createStream:  sig("createStream(address,address,uint256,uint64,uint64)"),
  // vault
  state:         sig("state()"),
  streamedAt:    sig("streamedAt(uint256)"),
  withdrawable:  sig("withdrawable()"),
  withdraw:      sig("withdraw()"),
  forward:       sig("forward(address,address)"),
  cancel:        sig("cancel()"),
  recipient:     sig("recipient()"),
  payer:         sig("payer()"),
  token:         sig("token()"),
  amount:        sig("amount()"),
  start:         sig("start()"),
  end:           sig("end()"),
  duration:      sig("duration()"),
  canceled:      sig("canceled()"),
  withdrawn:     sig("withdrawn()"),
  factory:       sig("factory()"),
};
// FALSIFIABLE, reproduce by hand:
//   cast sig "withdraw()"          -> 0x3ccfd60b   (NO ARGS — the payee cannot depend on the caller)
//   cast sig "forward(address,address)" -> 0x95ccf8bf  (the daemon's byte-exact calldata shape)
//   cast sig "state()"             -> 0xc19d93fb
// The vault exposes BOTH withdraw() and forward(address,address); both hit _pull(). The page uses the
// zero-arg one because its "permissionless" claim is cleanest when the calldata carries no caller
// data at all. verify.mjs asserts SEL.withdraw == cast sig and that the live code CONTAINS it.

// the fee, mirroring the contract EXACTLY: floor(w * bps / 10_000), taken from the PULLED amount.
const applyFee = (w, bps) => { const fee = (BigInt(w) * BigInt(bps)) / 10000n; return { fee, recipientOut: BigInt(w) - fee }; };

function encodeCreateStream(recipient, token, amount, start, end) {
  return SEL.createStream + addr32(recipient) + addr32(token) + pad32(amount) + pad32(start) + pad32(end);
}
function encodePredict(payer, recipient, token, amount, start, end) {
  return SEL.predict + addr32(payer) + addr32(recipient) + addr32(token) + pad32(amount) + pad32(start) + pad32(end);
}
const encodeStreamedAt = (t) => SEL.streamedAt + pad32(t);
const encodeStreamsOf = (who, i) => SEL.streamsOf + addr32(who) + pad32(i);

// =============================== rpc ============================================================
const app = document.getElementById("app");
const $ = (h) => { app.innerHTML = h; };

// Endpoint FALLBACK (GOTCHA #147(b)): a public Base RPC rate-limits in storms and a retry that re-hits
// the SAME url just re-earns the 429. Rotate to the next endpoint on retry, then hold on the last.
// ENDPOINT-POLICY order: the gate's winner first, then drpc -> base.org. `EP` is set by the boot gate
// (pickEndpoint) before any read runs; the plain [RPC, …] order is the fallback if that gate is skipped.
let EP = { url: RPC, cid: CHAIN_ID };
// Endpoints that FAILED THE TRANSPORT layer (timeout/abort, DNS, connection refused) — as opposed to a
// 429, which is a live endpoint asking for a pause. A black-holed ?rpc= used to re-enter every rotation
// after the gate had already rejected it: each pass cost its full 8s abort, and the burst-then-rotate
// path landed on it repeatedly (measured 47.5s to settle vs 7.2s without the override). Once an
// endpoint has burned its timeout it is out of the rotation for the life of the page; the gate's winner
// is always kept so the list can never empty.
const DEAD = new Set();
// re-read the gate's winner — the order is computed PER CALL, because the gate resolves after module
// load, so pinning the order at load would still point at a dead override.
function epOrder(){
  const all = [EP.url, ...RPC_ALTS, RPC].filter((u, i, a) => u && a.indexOf(u) === i);
  const live = all.filter((u) => u === EP.url || !DEAD.has(u));
  return live.length ? live : all;
}
// is this failure a transport death (pull the endpoint) or a live-but-busy answer (keep it)?
// An AbortError is our own 8s timeout = dead. A 429/HTTP error is the endpoint answering = alive.
const isDeath = (e) => {
  const n = (e && e.name) || "";
  const m = String((e && e.message) || e || "");
  if (n === "AbortError" || n === "TypeError" || /abort|timeout|Failed to fetch|network/i.test(m)) return true;
  return false;
};
async function rpcOn(method, params, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    const order = epOrder();
    const url = order[Math.min(i, order.length - 1)];
    try {
      const r = await _fetchT(url, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
      // 429 = the endpoint is ALIVE and asking us to slow down. It answers nothing, so this attempt
      // still fails and rotates, but the endpoint must not be pulled from the order.
      if (r.status === 429) throw new Error("rpc 429 (rate limited)");
      const j = await r.json();
      if (j.error) throw new Error(j.error.message || "rpc error");
      if (j.result === undefined) throw new Error(j.message || `rpc ${r.status} (no result)`);
      return j.result;
    } catch (e) {
      last = e;
      // A REVERT is a real answer (GOTCHA #147): the endpoint did its job and the chain said no. Rotating
      // it to two more endpoints just re-asks the same question — the impostor row alone spent ~3.5s of
      // the healthy boot proving the same revert three times. Answer once.
      if (/revert/i.test(String((e && e.message) || e))) throw e;
      if (isDeath(e)) DEAD.add(url);           // don't pay its timeout again
      if (i < tries - 1) await new Promise((s) => setTimeout(s, 400 * (i + 1)));
    }
  }
  throw last;
}
async function ethCall(to, data) { return rpcOn("eth_call", [{ to, data }, "latest"]); }

// ONE endpoint gate before any proof work. Without it every rpcOn() pays its own 3-try rotation, and a
// probe() wraps that twice, so a black-holed ?rpc= left the boot spinner indefinitely: the page had no
// single place that decided "no endpoint at all" — each read re-discovered it. Probe the override alone
// first (short timeout), then race the alts; the winner is pinned for the whole page.
async function pickEndpoint() {
  const probeEp = async (cand) => {
    let r;
    try {
      r = await _fetchT(cand, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_chainId", params: [] }),
      }, 5000);
    } catch (e) { if (isDeath(e)) DEAD.add(cand); throw e; }
    if (r.status === 429) throw new Error("rpc 429 (rate limited)");
    const j = await r.json();
    if (j.error) throw new Error(j.error.message || "rpc error");
    const c = Number(BigInt(j.result));
    if (c !== CHAIN_ID) throw new Error(`chainId ${c} ≠ ${CHAIN_ID}`);
    return cand;
  };
  let lastErr = null;
  try { return await probeEp(RPC); } catch (e) { lastErr = String((e && e.message) || e); }
  for (let round = 0; round < 2; round++) {
    try { return await Promise.any(RPC_ALTS.map(probeEp)); }
    catch (e) { if (e && e.errors) lastErr = e.errors.map(String).join("; "); }
  }
  return { err: lastErr || "unreachable" };
}

// THREE DISTINCT statuses (GOTCHAS #27/#112/#147): 'ok' answered, 'reverted' answered-no,
// 'unreachable' transport fault. A revert is a REAL answer; a fault is not evidence of absence.
// ONE attempt: rpcOn already rotates across the whole live endpoint order, so an outer retry here would
// re-walk that rotation a second time (6 requests per probe) and was most of the post-gate latency.
async function probe(to, data) {
  try { return { status: "ok", value: await ethCall(to, data) }; }
  catch (e) {
    const m = String((e && e.message) || e);
    if (/revert/i.test(m)) return { status: "reverted", value: null, err: m };
    return { status: "unreachable", value: null, err: m };
  }
}

// =============================== factory identity proof ==========================================
// The proof is RUNTIME IDENTITY, not address familiarity (GOTCHA #95). We fetch the code and hash it
// ourselves, then also require the factory's own getters to answer. The impostor row runs the same
// probe and must FAIL it.
async function proveFactory(addr, label, expectBytes) {
  const out = { label, addr, verdict: null, problems: [], faults: [], codeBytes: null, hashOk: null };
  let code;
  try { code = await rpcOn("eth_getCode", [addr, "latest"]); }
  catch (e) { out.verdict = "unreachable"; out.problems.push("rpc " + String(e.message || e)); return out; }

  out.codeBytes = Math.max(0, (code.length - 2) / 2);
  if (out.codeBytes === 0) { out.verdict = "wrong"; out.problems.push("NO CODE at this address on Base"); return out; }

  const h = keccak256(code);
  out.hashOk = h === ARTEFACT_KECCAK;
  if (out.codeBytes !== expectBytes) out.problems.push(`runtime is ${out.codeBytes} B, not the recorded ${expectBytes} B`);
  if (!out.hashOk) out.problems.push(`keccak(runtime) = ${short(h)} ≠ artefact ${short(ARTEFACT_KECCAK)}`);

  // CODE EVIDENCE IS DECISIVE. If the fetched runtime already mismatches the recorded artefact on size
  // or hash, this address is WRONG on identity alone — no getter needed. A later transport fault on a
  // corroborating getter must NOT downgrade that to "unreachable" (the impostor flake: a 429 on the
  // probe flipped a proven-wrong row to unreachable).
  const codeWrong = out.codeBytes !== expectBytes || !out.hashOk;

  // the factory's OWN getters. streamCount() must ANSWER (the impostor REVERTS it — the #95 bite).
  const sc = await probe(addr, SEL.streamCount + addr32(PAYER));
  const fb = await probe(addr, SEL.feeBps);
  const getFault = sc.status === "unreachable" || fb.status === "unreachable";
  if (sc.status === "reverted") out.problems.push(`streamCount() reverted — no such function (the Sepolia-string impostor REVERTS)`);
  else if (sc.status !== "ok" && getFault) out.faults.push("streamCount() unreachable");
  if (fb.status === "reverted") out.problems.push(`feeBps() reverted — no such function`);
  else if (fb.status !== "ok" && getFault) out.faults.push("feeBps() unreachable");

  if (codeWrong) out.verdict = "wrong";                       // decisive, chain-derived
  else if (getFault) out.verdict = "unreachable";             // code matches but getters couldn't confirm
  else if (out.hashOk && sc.status === "ok" && fb.status === "ok") out.verdict = "proved";
  else out.verdict = out.problems.length ? "wrong" : "unreachable";
  return out;
}

// read a vault's full live state in one pass; every field independently fault-tolerant
async function rpcRaw(v) {
  const p = (data) => ethCall(v, data);
  const out = {};
  try {
    out.recipient = addrOf(await p(SEL.recipient));
    out.payer = addrOf(await p(SEL.payer));
    out.token = addrOf(await p(SEL.token));
    out.amount = hexToBig(await p(SEL.amount));
    out.start = Number(hexToBig(await p(SEL.start)));
    out.end = Number(hexToBig(await p(SEL.end)));
    out.canceled = hexToBig(await p(SEL.canceled)) === 1n;
    out.withdrawn = hexToBig(await p(SEL.withdrawn));
    out.withdrawable = hexToBig(await p(SEL.withdrawable));
    out.streamed = hexToBig(await p(encodeStreamedAt(nowSec())));
    out.state = await p(SEL.state);
    return out;
  } catch (e) { out.err = String(e.message || e); return Object.keys(out).length > 1 ? out : null; }
}

function renderVault(v, feeBpsLive) {
  const host = document.getElementById("vault");
  if (!v) { host.innerHTML = `<p class="mut" style="margin:8px 0 0">vault unreadable — rpc fault, not a zero.</p>`; return; }

  const st = v.state && v.state.length >= 322 ? v.state.replace(/^0x/, "") : null;
  const rate = st ? BigInt("0x" + st.slice(192, 256)) : null;   // state().rate = amount/duration
  // rpcRaw aborts mid-sequence on a transport fault and returns a PARTIAL object; if the fault landed
  // before start/end, `v.start`/`v.end` are undefined and `new Date(undefined*1000).toISOString()`
  // THROWS "Invalid time value" — crashing the whole render (the flake seen at 1-in-N). Guard the
  // window so a partial read degrades to "—", never a RangeError.
  const hasWindow = Number.isFinite(v.start) && Number.isFinite(v.end);
  const fmtTs = (s) => Number.isFinite(s) ? new Date(s * 1000).toISOString() : "—";
  const dur = hasWindow ? v.end - v.start : null;
  const elapsed = hasWindow ? Math.max(0, Math.min(nowSec(), v.end) - v.start) : 0;
  const pct = (hasWindow && dur > 0) ? Math.min(100, (elapsed / dur) * 100) : (hasWindow ? 100 : 0);
  const bps = feeBpsLive === null ? null : BigInt(feeBpsLive);
  const feeNote = (bps !== null && v.withdrawable > 0n) ? applyFee(v.withdrawable, bps) : null;

  host.innerHTML = `
    <div class="addr"><b>vault</b> ${esc(VAULT_LIVE)}
      &nbsp;<a href="${EXPLORER}/address/${esc(VAULT_LIVE)}" target="_blank" rel="noopener">explorer →</a></div>
    <div class="kv" style="margin-top:12px">
      <div class="k">payer</div><div>${esc(v.payer)}</div>
      <div class="k">recipient</div><div>${esc(v.recipient)}</div>
      <div class="k">token</div><div>${v.token === "0x0000000000000000000000000000000000000000" ? "native ETH" : esc(v.token)}</div>
      <div class="k">amount</div><div>${fmt18(v.amount)} ${v.token === "0x0000000000000000000000000000000000000000" ? "ETH" : "units"}</div>
      <div class="k">window</div><div>${dur === null ? "—" : esc(dur) + "s"} &nbsp;<span class="mut">(${fmtTs(v.start)} → ${fmtTs(v.end)})</span></div>
      <div class="k">rate</div><div>${rate === null ? "—" : rate.toString() + " wei/s"}</div>
      <div class="k">streamed</div><div>${fmt18(v.streamed)}</div>
      <div class="k">withdrawn</div><div>${fmt18(v.withdrawn)}</div>
      <div class="k">withdrawable</div><div>${fmt18(v.withdrawable)} ${v.canceled ? `<span class="badge warn">canceled — 0 by design</span>` : ""}</div>
    </div>
    <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
    <p class="mut" style="margin:4px 0 0">${pct.toFixed(1)}% vested by wall-clock.</p>
    ${v.canceled
      ? `<p class="mut" style="margin:6px 0 0"><b>This stream was canceled.</b> Note
         <code>withdrawable()</code> is 0 even though a pure time-based figure would keep rising —
         <code>cancel()</code> paid the accrued part out and refunded the payer the rest, so the vault
         is empty and the stream is over. The vault's <code>withdrawable()</code> is guarded, not naive
         (a naive one would pay a second time out of money already refunded).</p>`
      : `<p class="mut" style="margin:6px 0 0">Not canceled. The payer can <code>cancel()</code> at any
         time (payer-only): that pays the recipient what has accrued, refunds the payer the rest, and
         ends the stream — after which <code>withdrawable()</code> is 0 <b>by design</b>, even though a
         pure time-based figure would keep rising. The vault is cancel-aware, not naive.</p>`}
    <p class="mut" style="margin:8px 0 0"><b>withdraw() takes NO arguments.</b> The recipient is an
      immutable on the vault, so whoever sends the tx, the money goes to ${esc(short(v.recipient))}.
      The caller is only the gas payer — that is what "permissionless" means here.
      ${feeNote ? `Pulling now would split floor(w·${esc(bps)}/10000) = ${fmt18(feeNote.fee)} to the fee recipient and <b>${fmt18(feeNote.recipientOut)}</b> to the recipient.` : ""}</p>
    <div class="row" style="margin-top:10px">
      <button id="vWithdraw">send withdraw()</button>
      <button class="ghost" id="vProbe">trace the split (eth_call)</button>
      <span class="mut" id="vMsg"></span>
    </div>`;

  document.getElementById("vProbe").onclick = async () => {
    const msg = document.getElementById("vMsg");
    msg.textContent = "calling…";
    try {
      // withdraw() returns (uint256 recipientOut, uint256 fee) — the split, straight from the code
      const r = await ethCall(VAULT_LIVE, SEL.withdraw);
      const w = r.replace(/^0x/, "");
      const recipientOut = BigInt("0x" + w.slice(0, 64));
      const fee = BigInt("0x" + w.slice(64, 128));
      if (recipientOut === 0n && fee === 0n) { msg.textContent = "withdrawable is 0 — a no-op, not an error (status 1)."; return; }
      msg.innerHTML = `recipientOut = <b>${esc(fmt18(recipientOut))}</b>, fee = <b>${esc(fmt18(fee))}</b> — the recipient is paid regardless of who calls.`;
    } catch (e) { msg.textContent = "revert/fault: " + String(e.message || e); }
  };
  document.getElementById("vWithdraw").onclick = async () => {
    const msg = document.getElementById("vMsg");
    if (!window.ethereum) { msg.textContent = "no window.ethereum — calldata: " + SEL.withdraw; return; }
    try {
      msg.textContent = "awaiting wallet…";
      const [from] = await window.ethereum.request({ method: "eth_requestAccounts" });
      const tx = await window.ethereum.request({ method: "eth_sendTransaction",
        params: [{ from, to: VAULT_LIVE, data: SEL.withdraw }] });
      msg.innerHTML = `sent <code>${esc(short(tx))}</code> from ${esc(short(from))} — the payout still goes to ${esc(short(v.recipient))}.`;
    } catch (e) { msg.textContent = "wallet: " + (e.message || e); }
  };
}

function wireCreate() {
  document.getElementById("cPredict").onclick = async () => {
    const out = document.getElementById("cOut");
    const recipient = document.getElementById("cRecipient").value.trim();
    const payer = document.getElementById("cPayer").value.trim();
    const amount = document.getElementById("cAmount").value.trim();
    const dur = Number(document.getElementById("cDuration").value.trim());
    if (!isAddr(recipient) || !isAddr(payer)) { out.innerHTML = `<p class="mut">recipient/payer must be 20-byte addresses.</p>`; return; }
    if (!(dur >= 60)) { out.innerHTML = `<p class="mut">duration must be ≥ MIN_DURATION() = 60s.</p>`; return; }
    const start = nowSec() + 30, end = start + dur;
    const data = encodePredict(payer, recipient, "0x0000000000000000000000000000000000000000", amount, start, end);
    out.innerHTML = `<p class="mut" style="margin-top:10px">predicting…</p>`;
    try {
      const addr = addrOf(await ethCall(FACTORY, data));
      out.innerHTML = `
        <div class="addr" style="margin-top:10px"><b>predicted vault</b> ${esc(addr)}
          &nbsp;<a href="${EXPLORER}/address/${esc(addr)}" target="_blank" rel="noopener">explorer →</a>
          <div class="mut">window ${new Date(start * 1000).toISOString()} → ${new Date(end * 1000).toISOString()}</div></div>
        <p class="mut" style="margin:8px 0 0">The real CREATE2 address, from the factory's own
          <code>predict()</code>, for the payer's CURRENT nonce. Nonce is an input: if the payer sends
          anything else first, re-predict (this is GOTCHA #128 — a CREATE prediction is only valid for
          the nonce you read).</p>
        <pre>createStream calldata:\n${esc(data)}</pre>`;
    } catch (e) { out.innerHTML = `<p class="mut" style="margin-top:10px">fault/revert: ${esc(String(e.message || e))}</p>`; }
  };
}

// =============================== router =========================================================
function route() {
  const h = location.hash || "#/";
  const m = h.match(/vault=(0x[0-9a-fA-F]{40})/);
  viewHome();
}
window.addEventListener("hashchange", route);
route();
